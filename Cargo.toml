[package]
name = "palimpsest"
version = "0.1.0"
edition = "2021"
description = "A safe self-rewriting term-rewriting language interpreter"

[[bin]]
name = "palimpsest"
path = "src/main.rs"

[profile.release]
opt-level = 2
panic = "unwind"

[dependencies]
# Exact arithmetic: arbitrary-precision integers and rationals (see src/num.rs).
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
